<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up SHUTTLE</title><link rel="stylesheet" href="/account.css"><script type="module" src="/account-setup.js"></script></head><body><main><h1>Set up SHUTTLE</h1><p>One-time owner setup. Use the private setup key from your Vercel environment. Do not share it in chat.</p><form data-account="bootstrap"><label>Owner email<input name="email" type="email" autocomplete="username" required></label><label>Private setup key<input name="setupKey" type="password" autocomplete="off" required></label><label>Choose password<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button>Create owner account</button><p id="error" role="status"></p></form></main></body></html>
